version: '3.8'

services:
  evm-hot-wallet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evm-hot-wallet
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist database
      - wallet-data:/app/data
      # Per-chain configuration (copy chains.toml.example to chains.toml)
      - ./chains.toml:/app/chains.toml:ro
    env_file:
      - .env
    environment:
      DATABASE_URL: /app/data/wallet.db
      CHAINS_CONFIG: /app/chains.toml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - evm-network

volumes:
  wallet-data:
    driver: local

networks:
  evm-network:
    driver: bridge
