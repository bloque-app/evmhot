# Local run: evmhot + Postgres, against public RPC endpoints.
#   cp chains.toml.example chains.toml   # then edit rpc_url / addresses (see README)
#   cp env.docker.example .env
#   docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evmhot
      POSTGRES_PASSWORD: evmhot-local-dev
      POSTGRES_DB: evmhot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evmhot"]
      interval: 5s
      timeout: 3s
      retries: 10

  evmhot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://evmhot:evmhot-local-dev@postgres:5432/evmhot
      DB_TLS_MODE: disable # local Postgres has no TLS; leave unset against a real one
      CHAINS_CONFIG: /etc/evmhot/chains.toml
    volumes:
      - ./chains.toml:/etc/evmhot/chains.toml:ro
    ports:
      - "3000:3000"

volumes:
  pgdata:
